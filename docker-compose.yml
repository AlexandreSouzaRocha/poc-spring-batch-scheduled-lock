name: poc-partitioner

x-app-env: &app-env
  SPRING_MONGODB_URI: mongodb://mongo:27017/partitioner_batch?directConnection=true
  SPRING_MONGODB_DATABASE: partitioner_batch
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  APP_BLOB_ENDPOINT: http://azurite:10000/devstoreaccount1
  APP_BLOB_ACCOUNT_NAME: devstoreaccount1
  APP_BLOB_ACCOUNT_KEY: "Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw=="
  APP_BLOB_CONTAINER: movimentos
  APP_FILE_LINE_SEPARATOR: ${FILE_LINE_SEPARATOR:-LF}
  APP_PARTITION_CONCURRENCY_CONTROL: ${PARTITION_CONCURRENCY_CONTROL:-TYPE_LOCK}
  APP_PARTITION_MAX_CONCURRENT_TYPES: ${PARTITION_MAX_CONCURRENT_TYPES:-1}
  APP_PARTITION_COUNT: ${PARTITION_COUNT:-10}
  APP_PARTITION_MAX_ATTEMPTS: ${PARTITION_MAX_ATTEMPTS:-3}
  APP_PARTITION_THREADS_PER_PARTITION: ${PARTITION_THREADS:-4}
  APP_PARTITION_PROGRESS_INTERVAL_SECONDS: ${PARTITION_PROGRESS_INTERVAL:-10}
  APP_PARTITION_SERVER_SIDE_COPY: ${PARTITION_SERVER_SIDE_COPY:-false}
  APP_PARTITION_SERVER_SIDE_BLOCK_SIZE_MB: ${PARTITION_SERVER_SIDE_BLOCK_MB:-64}
  APP_BLOB_UPLOAD_BLOCK_SIZE_MB: ${PARTITION_BLOCK_MB:-8}
  APP_BLOB_READ_BLOCK_SIZE_MB: ${PARTITION_READ_BLOCK_MB:-8}
  APP_BLOB_TRY_TIMEOUT_SECONDS: ${BLOB_TRY_TIMEOUT:-60}
  APP_BLOB_RESPONSE_TIMEOUT_SECONDS: ${BLOB_RESPONSE_TIMEOUT:-60}
  APP_SCHEDULER_INTERVAL: ${SCHEDULER_INTERVAL:-30s}
  OTEL_JAVAAGENT_ENABLED: ${OTEL_ENABLED:-true}
  JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar -XX:+Use${JVM_GC:-G1}GC -XX:+UseCompactObjectHeaders -XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=70.0 -XX:+PrintCommandLineFlags -Xlog:gc*:file=/tmp/gc.log --sun-misc-unsafe-memory-access=allow"

x-app-depends: &app-depends
  kafka:
    condition: service_healthy
  mongo:
    condition: service_healthy
  azurite:
    condition: service_healthy
  mongo-init:
    condition: service_completed_successfully
  kafka-init:
    condition: service_completed_successfully
  azurite-init:
    condition: service_completed_successfully

x-app-healthcheck: &app-healthcheck
  test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q UP || exit 1"]
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 20s

services:
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: psl-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 7M2p4nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: psl-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  mongo:
    image: mongo:7
    container_name: psl-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--setParameter", "transactionLifetimeLimitSeconds=60"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 10

  mongo-init:
    image: mongo:7
    container_name: psl-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_DATABASE: partitioner_batch
      BATCH_RETENTION_DAYS: ${BATCH_RETENTION_DAYS:-7}
      APP_SHEDLOCK_COLLECTION: ${APP_SHEDLOCK_COLLECTION:-scheduler_locks}
      APP_SHEDLOCK_FIELD_NAME: ${APP_SHEDLOCK_FIELD_NAME:-_id}
    volumes:
      - ./docker:/init:ro
    entrypoint: ["bash", "/init/mongo-init.sh"]
    restart: "no"

  kafka-init:
    image: confluentinc/cp-kafka:7.8.0
    container_name: psl-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      APP_KAFKA_TOPIC: ${APP_KAFKA_TOPIC:-movimentos-particionados}
      APP_KAFKA_TOPIC_PARTITIONS: ${APP_KAFKA_TOPIC_PARTITIONS:-10}
    volumes:
      - ./docker:/init:ro
    entrypoint: ["bash", "/init/kafka-init.sh"]
    restart: "no"

  azurite-init:
    image: mcr.microsoft.com/azure-cli:latest
    container_name: psl-azurite-init
    depends_on:
      azurite:
        condition: service_healthy
    environment:
      APP_BLOB_ENDPOINT: http://azurite:10000/devstoreaccount1
      APP_BLOB_ACCOUNT_NAME: devstoreaccount1
      APP_BLOB_ACCOUNT_KEY: "Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw=="
      APP_BLOB_CONTAINER: ${APP_BLOB_CONTAINER:-movimentos}
    volumes:
      - ./docker:/init:ro
    entrypoint: ["bash", "/init/azurite-init.sh"]
    restart: "no"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:${AZURITE_VERSION:-3.35.0}
    container_name: psl-azurite
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--skipApiVersionCheck", "--disableProductStyleUrl", "--location", "/data"]
    ports:
      - "10000:10000"
    environment:
      UV_THREADPOOL_SIZE: ${AZURITE_THREADS:-16}
    deploy:
      resources:
        limits:
          cpus: "${AZURITE_CPUS:-8}"
          memory: ${AZURITE_MEMORY:-8g}
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(10000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12

  generator:
    build:
      context: .
    image: poc-spring-batch-partitioner:latest
    container_name: psl-generator
    hostname: generator
    ports:
      - "8090:8081"
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: generator
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=generator
    healthcheck: *app-healthcheck
    deploy:
      resources:
        limits:
          cpus: "${GENERATOR_CPUS:-2}"
          memory: 1g
    depends_on: *app-depends

  partitioner-1:
    image: poc-spring-batch-partitioner:latest
    container_name: psl-partitioner-1
    hostname: partitioner-1
    ports:
      - "8081:8081"
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: partitioner
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=partitioner-1
    healthcheck: *app-healthcheck
    deploy:
      resources:
        limits:
          cpus: "${PARTITIONER_CPUS:-4}"
          memory: ${PARTITIONER_MEMORY:-4g}
    depends_on:
      <<: *app-depends
      generator:
        condition: service_started

  partitioner-2:
    image: poc-spring-batch-partitioner:latest
    container_name: psl-partitioner-2
    hostname: partitioner-2
    ports:
      - "8082:8081"
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: partitioner
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=partitioner-2
    healthcheck: *app-healthcheck
    deploy:
      resources:
        limits:
          cpus: "${PARTITIONER_CPUS:-4}"
          memory: ${PARTITIONER_MEMORY:-4g}
    depends_on:
      <<: *app-depends
      generator:
        condition: service_started

volumes:
  azurite-data:
  mongo-data:
